<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Series Batch Downloader Options</title>
  <style>
    body {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 24px;
      color: #cdd6f4;
      background: #1e1e2e;
      font: 14px system-ui, sans-serif;
    }
    h1 { color: #89b4fa; font-size: 22px; }
    label { display: block; margin: 24px 0 8px; font-weight: 600; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #45475a;
      border-radius: 4px;
      color: #cdd6f4;
      background: #181825;
    }
    p { color: #a6adc8; line-height: 1.5; }
    button {
      margin-top: 16px;
      padding: 9px 16px;
      border: 0;
      border-radius: 4px;
      color: #11111b;
      background: #89b4fa;
      font-weight: 700;
      cursor: pointer;
    }
    #use-downloads {
      margin-left: 8px;
      color: #cdd6f4;
      background: #45475a;
    }
    #status { min-height: 20px; color: #a6e3a1; }
  </style>
</head>
<body>
  <h1>Series Batch Downloader</h1>
  <p>Choose a relative folder under Chrome's Downloads directory. For example, <strong>Media/TV Series</strong> saves files under that folder, followed by the series and season folders.</p>
  <label for="master-directory">Master directory</label>
  <input id="master-directory" type="text" placeholder="Media/TV Series" autocomplete="off">
  <button id="save">Save settings</button>
  <button id="use-downloads" type="button">Use Downloads folder</button>
  <p id="status" role="status"></p>
  <script src="options.js"></script>
</body>
</html>
