<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 12px;
      margin: 0;
      background: #1e1e2e;
      color: #cdd6f4;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 10px 0;
      color: #89b4fa;
    }
    #episode-list {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 8px;
      background: #181825;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .item input {
      cursor: pointer;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .presets {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .presets button {
      flex: 1;
      padding: 6px 4px;
      font-size: 11px;
    }
    .options-link {
      display: block;
      margin-top: 10px;
      color: #89b4fa;
      font-size: 11px;
      text-align: right;
      cursor: pointer;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #585b70;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      color: #a6adc8;
    }
  </style>
</head>
<body>
  <h2>Detected Episodes</h2>
  <div id="episode-list">
    <div id="status">Scanning active tab...</div>
  </div>
  
  <div class="controls">
    <label style="font-size: 12px;">
      <input type="checkbox" id="select-all"> Select All
    </label>
    <button id="download-btn" disabled>Download (0)</button>
  </div>
  <div class="presets">
    <button id="select-all-btn" type="button">All</button>
    <button id="season-one-btn" type="button">Season 1</button>
    <button id="deselect-all-btn" type="button">None</button>
  </div>
  <a class="options-link" id="options-link">Download folder options</a>

  <script src="popup.js"></script>
</body>
</html>
